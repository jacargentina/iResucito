appId: com.javiercastro.iresucito
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: settings-tab
    timeout: 30000
- tapOn:
    id: settings-tab
- extendedWaitUntil:
    visible:
      id: locale-input
    timeout: 30000
- tapOn:
    id: locale-input
- scrollUntilVisible:
    element:
      text: ${LOCALE_LABEL}
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ${LOCALE_LABEL}
- extendedWaitUntil:
    visible:
      id: locale-input
    timeout: 30000
- takeScreenshot: Configuracion
- tapOn:
    id: locale-input
- scrollUntilVisible:
    element:
      text: ${LOCALE_LABEL}
    direction: DOWN
    timeout: 20000
- takeScreenshot: Configuracion-Idiomas
- tapOn:
    text: ${LOCALE_LABEL}
- tapOn:
    id: songs-tab
- extendedWaitUntil:
    visible:
      id: search_title.alpha
    timeout: 30000
- takeScreenshot: BuscarCantos
- tapOn:
    id: search_title.alpha
- tapOn:
    text: Input Field
- inputText: "${SONG_ONE}"
- extendedWaitUntil:
    visible:
      id: "song-${SONG_ONE}"
    timeout: 30000
- tapOn:
    id: "song-${SONG_ONE}"
    point: "50%,20%"
    retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: "song-${SONG_ONE}"
    commands:
      - tapOn:
          id: "song-${SONG_ONE}"
          point: "50%,20%"
- extendedWaitUntil:
    visible:
      id: view-pdf-button
    timeout: 30000
- takeScreenshot: Canto-Pantalla
- tapOn:
    id: view-pdf-button
- extendedWaitUntil:
    visible:
      text: PDF - .*
    timeout: 30000
- takeScreenshot: Canto-PDF
- tapOn:
    id: back-button
- tapOn:
    id: back-button
- tapOn:
    id: back-button
- tapOn:
    id: lists-tab
- extendedWaitUntil:
    visible:
      id: add-list
    timeout: 30000
- tapOn:
    id: add-list
- tapOn:
    id: list_type.other
- tapOn:
    id: list-name-input
- inputText: Comunidad Demo
- tapOn:
    id: list-name-button
- extendedWaitUntil:
    visible:
      id: add-song-button
    timeout: 30000
- tapOn:
    id: add-song-button
- tapOn:
    text: Input Field
- inputText: "${SONG_ONE}"
- extendedWaitUntil:
    visible:
      id: "song-${SONG_ONE}"
    timeout: 30000
- tapOn:
    id: "song-${SONG_ONE}"
    point: "50%,20%"
    retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: "song-${SONG_ONE}"
    commands:
      - tapOn:
          id: "song-${SONG_ONE}"
          point: "50%,20%"
- extendedWaitUntil:
    visible:
      id: add-song-button
    timeout: 30000
- tapOn:
    id: add-song-button
- tapOn:
    text: Input Field
- inputText: "${SONG_TWO}"
- extendedWaitUntil:
    visible:
      id: "song-${SONG_TWO}"
    timeout: 30000
- tapOn:
    id: "song-${SONG_TWO}"
    point: "50%,20%"
    retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: "song-${SONG_TWO}"
    commands:
      - tapOn:
          id: "song-${SONG_TWO}"
          point: "50%,20%"
- extendedWaitUntil:
    visible:
      id: add-song-button
    timeout: 30000
- tapOn:
    id: add-song-button
- tapOn:
    text: Input Field
- inputText: "${SONG_THREE}"
- extendedWaitUntil:
    visible:
      id: "song-${SONG_THREE}"
    timeout: 30000
- tapOn:
    id: "song-${SONG_THREE}"
    point: "50%,20%"
    retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: "song-${SONG_THREE}"
    commands:
      - tapOn:
          id: "song-${SONG_THREE}"
          point: "50%,20%"
- takeScreenshot: Lista-Pantalla
- tapOn:
    id: share-list-button
- extendedWaitUntil:
    visible:
      id: share-list-pdf
    timeout: 10000
- tapOn:
    id: share-list-pdf
- extendedWaitUntil:
    visible:
      text: PDF - Comunidad Demo
    timeout: 30000
- takeScreenshot: Lista-PDF
- tapOn:
    id: back-button
- tapOn:
    id: back-button
- extendedWaitUntil:
    visible:
      id: list-Comunidad Demo
    timeout: 30000
- takeScreenshot: Listas
- tapOn:
    id: community-tab
- extendedWaitUntil:
    visible:
      id: community-tab
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: Comunidad
